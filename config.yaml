# ---- Resumes ----
resumes:
  analyst:
    tex: "resumes/VedangTrivedi_Analyst.tex"
    pdf: "resumes/VedangTrivedi_Analyst.pdf"
  swe:
    tex: "resumes/VedangTrivedi_SWE.tex"
    pdf: "resumes/VedangTrivedi_SWE.pdf"

# ---- Filters ----
filters:
  max_years_experience: 2          # apply to roles demanding 0-2 yrs
  internship_min_stipend_inr: 30000
  priority_location: "Ahmedabad"    # always swept in, regardless of other filters
  priority_location_aliases: ["ahmedabad", "amdavad", "ahmadabad"]
  ats_tailor_threshold: 85          # only used if tailoring.enabled below is true
  resume_override_margin: 15        # best-fit resume pick: trust classify.py's title/keyword
                                      # role over the raw ATS content score unless the OTHER
                                      # resume beats it by more than this many points

# ---- Resume tailoring — OFF by default ----
tailoring:
  enabled: false

# ---- Adzuna: PRIMARY discovery engine — NO company list needed ----
adzuna:
  enabled: true
  country: "in"
  results_per_page: 50
  max_pages_per_query: 2
  searches:
    - keywords: "business analyst"
      location: "Ahmedabad"
    - keywords: "data analyst"
      location: "Ahmedabad"
    - keywords: "software engineer"
      location: "Ahmedabad"
    - keywords: "business analyst"
      location: "India"
    - keywords: "data analyst"
      location: "India"
    - keywords: "software engineer"
      location: "India"

# ---- Remote boards (no company list needed) ----
remote_boards:
  remoteok: true
  weworkremotely:
    - "remote-programming-jobs"
    - "remote-business-development-jobs"
    # WWR has no dedicated "Analyst" category — these three slugs were
    # invented and don't exist (two even had spaces in them, which broke
    # the RSS URL outright: "URL can't contain control characters").
    # Confirmed via WWR's real category nav: analyst-type roles fit best
    # under "Management and Finance"; "All Other" is a valid fallback but
    # is a noisy catch-all (data entry, virtual assistants, etc. mixed in).
    - "remote-management-and-finance-jobs"

# ---- Direct board search — LinkedIn / Indeed / Glassdoor / Naukri / Google ----
jobspy:
  enabled: true
  sites: ["linkedin", "indeed", "glassdoor", "naukri", "google"]
  search_terms:
    analyst: "business analyst OR data analyst"
    swe: "software engineer OR SDE"
  locations: ["Ahmedabad, Gujarat, India", "India", "Remote"]
  results_wanted_per_query: 25
  hours_old: 48

