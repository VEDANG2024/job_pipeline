<!DOCTYPE html>
<html><body>
<form id="application_form">
  <label for="first_name">First Name*</label>
  <input id="first_name" name="first_name" type="text" required>
  <label for="last_name">Last Name*</label>
  <input id="last_name" name="last_name" type="text" required>
  <label for="email">Email*</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV*</label>
  <input id="resume" name="resume" type="file" required>
  <label for="urls_LinkedIn">LinkedIn Profile</label>
  <input id="urls_LinkedIn" name="urls[LinkedIn]" type="text">
  <label for="why_interested">Why do you want to work here?*</label>
  <textarea id="why_interested" name="why_interested" required></textarea>
  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body></html>
