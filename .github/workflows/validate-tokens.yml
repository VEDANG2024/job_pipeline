name: Validate Company Tokens

# On-demand only -- no schedule. This is a diagnostic audit of config.yaml's
# pinned Greenhouse/Lever company tokens, not part of the daily pipeline.
# Trigger it manually: GitHub -> Actions tab -> "Validate Company Tokens"
# in the left sidebar -> "Run workflow" button -> Run workflow (green
# button in the dropdown that appears).
on:
  workflow_dispatch: {}

jobs:
  validate-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run the token validator
        run: python -u validate_company_tokens.py | tee token_validation_report.txt

      - name: Commit the report back to the repo
        run: |
          git config user.name "job-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add token_validation_report.txt
          git diff --cached --quiet || git commit -m "Token validation report: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
