# Keyword taxonomy used to (a) pull candidate skills out of a JD and
# (b) check which of those the resume already covers.
# This is a heuristic keyword-overlap scorer, not a real ATS engine —
# it's meant to catch the same kind of naive keyword-matching that a
# lot of real ATS software does, not to be a perfect proxy for any one
# vendor's algorithm. Expand this list as you see JDs use terms it misses.

